# Prüft Änderungen auf Arbeitszweigen mit echten Daten, bevor sie nach main kommen:
# Tests, Browsertests mit simulierter Fahrt, Regionspakete aus dem aktuellen OSM-Auszug,
# Stichprobentest, App-Build.
# Veröffentlicht nichts.
name: Prüfen

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: App bauen
        run: npm run build
      - name: Browsertests (Handygröße, simulierte GPS-Fahrten)
        run: |
          npx playwright install --with-deps chromium
          npm run test:browser
      - name: OSM-Auszug Niedersachsen laden
        run: |
          mkdir -p data/osm
          curl -fL --retry 3 -o data/osm/niedersachsen-latest.osm.pbf \
            https://download.geofabrik.de/europe/germany/niedersachsen-latest.osm.pbf
      - name: Regionspakete bauen (alle PLZ in Niedersachsen)
        run: npm run build-regions -- --input data/osm/niedersachsen-latest.osm.pbf --state Niedersachsen --details 21395,21436
      - name: Stichprobentest
        run: npm run sample-test
      - name: Paketgrößen Tespe/Marschacht
        run: ls -l public/regions/21395.json.gz public/regions/21436.json.gz
