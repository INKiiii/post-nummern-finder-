# Baut die Regionspakete für Niedersachsen aus dem aktuellen OSM-Auszug (Geofabrik)
# und veröffentlicht App + Pakete auf GitHub Pages.
# Einmalig nötig: Repository-Einstellungen -> Pages -> Source: "GitHub Actions".
name: Bauen und veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1' # wöchentlich Montag früh: Daten aktualisieren

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            leitstand/package-lock.json
      - run: npm ci
      - run: npm test
      - name: OSM-Auszug Niedersachsen laden
        run: |
          mkdir -p data/osm
          curl -fL --retry 3 -o data/osm/niedersachsen-latest.osm.pbf \
            https://download.geofabrik.de/europe/germany/niedersachsen-latest.osm.pbf
      # Optional: amtliche Adressen (z. B. Hauskoordinaten) zusätzlich zu OSM.
      # Einrichten unter Settings › Secrets and variables › Actions › Variables:
      #   OFFICIAL_ADDR_URL    = Download-Adresse der CSV- oder ZIP-Datei
      #   OFFICIAL_ADDR_CONFIG = Spalten-Konfiguration (Standard: scripts/sources/niedersachsen-hk.json)
      - name: Amtliche Adressen laden (optional)
        if: ${{ vars.OFFICIAL_ADDR_URL != '' }}
        env:
          URL: ${{ vars.OFFICIAL_ADDR_URL }}
          CONFIG: ${{ vars.OFFICIAL_ADDR_CONFIG || 'scripts/sources/niedersachsen-hk.json' }}
        run: |
          mkdir -p data/official
          curl -fL --retry 3 -o data/official/download "$URL"
          if unzip -tq data/official/download >/dev/null 2>&1; then
            unzip -o -q data/official/download -d data/official
            f=$(find data/official -iname '*.csv' -o -iname '*.txt' | head -1)
          else
            f=data/official/download
          fi
          echo "Amtliche Datei: $f"
          head -3 "$f" || true
          echo "OFFICIAL_ARG=--official $f:$CONFIG" >> "$GITHUB_ENV"
      - name: Regionspakete bauen (alle PLZ in Niedersachsen)
        run: npm run build-regions -- --input data/osm/niedersachsen-latest.osm.pbf --state Niedersachsen --details 21395,21436 $OFFICIAL_ARG
      - name: Stichprobentest
        run: npm run sample-test
      - name: App bauen
        run: npm run build
      - run: cp report.csv dist/report.csv
      # Prototyp „Zustell-Leitstand 3D“ (nur erfundene Demo-Daten) unter /leitstand/
      - name: Leitstand-Prototyp prüfen und bauen
        working-directory: leitstand
        run: |
          npm ci
          npm test
          npm run build
      - run: cp -r leitstand/dist dist/leitstand
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/upload-artifact@v4
        with:
          name: report
          path: report.csv

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
