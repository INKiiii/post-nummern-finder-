[project]
name = "clipfabrik"
version = "0.1.0"
description = "Clip-Fabrik: Twitch-Stream rein, fertige Social-Media-Clips raus"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "cryptography>=42",
  "argon2-cffi>=23.1",
  "itsdangerous>=2.2",
  "httpx>=0.27",
  "anthropic>=2.0",
  "pywebpush>=2.0",
  "py-vapid>=1.9",
  "python-multipart>=0.0.9",
  "streamlink>=6.8",
  "yt-dlp>=2024.8.6",
  "numpy>=1.26",
  "websockets>=12",
]

[project.optional-dependencies]
whisper = ["faster-whisper>=1.0"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21", "pillow>=10"]

[project.scripts]
clipfabrik = "clipfabrik.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["clipfabrik*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "slow: Integrationstests mit ffmpeg/streamlink (laufen standardmäßig mit)",
]
filterwarnings = ["ignore::DeprecationWarning"]
